    <button class="value-control" onclick="numberInput.stepDown()" title="Decrease value" aria-label="Decrease value"><p>-</p></button>

    <input  class="value-input" type="number" value="1" min="0" name="numberInput" id="numberInput">

    <button class="value-control" onclick="numberInput.stepUp()" title="Increase value" aria-label="Increase value">+</button>

    <div>
        <button class="value-control"
        onclick="this.nextElementSibling.stepDown()">
        -
        </button>

        <input class="value-input" type="number" value="1" min="1">

        <button class="value-control"
        onclick="this.previousElementSibling.stepUp()">
        +

    </div>
